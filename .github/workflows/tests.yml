# Run the vailá test suite on every push and pull request to main.
#
# CPU wheels only (the default `uv sync` groups: dev + cpu). Tests that need CUDA,
# gated model weights or large media fixtures skip themselves when those are absent.
#
# Linux is the required job. macOS and Windows run as `experimental` (allowed to
# fail) until their first green run is confirmed; then drop `continue-on-error`.
# First run (PR #653, 2026-11-06): macOS 2765 passed / 3 failed (two were a hard-coded
# cwd, fixed); Windows 2735 passed / 33 failed, mostly files read without
# encoding="utf-8", POSIX path assumptions in tests and files still open on delete.
#
# Lint is not gated here yet: `ruff check vaila/ tests/` reports pre-existing findings on
# main (82 on 2026-11-05). Add a ruff step once those are cleared.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 60
    env:
      # Use uv's own CPython build: it ships tkinter on every OS. The Ubuntu runner's
      # system Python 3.12 has no tkinter, and 117 test modules failed to import.
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: macos-latest
            experimental: true
          - os: windows-latest
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libegl1, libgl1, libgomp1: Open3D; libxrender1, libxi6, libxkbcommon0: VTK and Qt-free GUIs
          # fonts-urw-base35: Tk's Helvetica resolves to Nimbus Sans, as on the developers'
          # machines; with DejaVu the GUI width tests measure about 2 % wider.
          sudo apt-get install -y ffmpeg pkg-config libcairo2-dev python3-dev build-essential xvfb \
            libegl1 libgl1 libgomp1 libxrender1 libxi6 libxkbcommon0 fonts-urw-base35

      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config cairo

      - name: System packages (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked environment (CPU)
        run: uv sync --frozen

      - name: Tests
        env:
          MPLBACKEND: Agg
        shell: bash
        # Linux runners have no display; xvfb-run gives Tk a virtual one. At 96 DPI Tk
        # sizes fonts as on a normal desktop (the FreeKiki width test measured 897 px at
        # 96 DPI on a developer machine and 977 px with Xvfb's default DPI).
        run: |
          cmd=(uv run --frozen pytest tests -q -p no:cacheprovider --junitxml=pytest-${{ matrix.os }}.xml)
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24 -dpi 96" "${cmd[@]}"
          else
            "${cmd[@]}"
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}
          path: pytest-${{ matrix.os }}.xml
