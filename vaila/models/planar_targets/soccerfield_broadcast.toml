[target]
name = "soccer_pitch_standard"
description = "Standard 105m x 68m FIFA Soccer Pitch with lines, penalty areas, and center circle"
type = "sports_pitch"

[points]
# Corner Flags
0 = { name = "corner_bl", x = 0.000, y = 0.000, z = 0.0 }
1 = { name = "corner_br", x = 105.000, y = 0.000, z = 0.0 }
2 = { name = "corner_tr", x = 105.000, y = 68.000, z = 0.0 }
3 = { name = "corner_tl", x = 0.000, y = 68.000, z = 0.0 }

# Halfway Line
4 = { name = "halfway_b", x = 52.500, y = 0.000, z = 0.0 }
5 = { name = "halfway_t", x = 52.500, y = 68.000, z = 0.0 }
6 = { name = "center_spot", x = 52.500, y = 34.000, z = 0.0 }

# Left Penalty Box
7  = { name = "left_pen_bl", x = 0.000,  y = 13.840, z = 0.0 }
8  = { name = "left_pen_br", x = 16.500, y = 13.840, z = 0.0 }
9  = { name = "left_pen_tr", x = 16.500, y = 54.160, z = 0.0 }
10 = { name = "left_pen_tl", x = 0.000,  y = 54.160, z = 0.0 }
11 = { name = "left_pen_spot", x = 11.000, y = 34.000, z = 0.0 }

# Right Penalty Box
12 = { name = "right_pen_br", x = 105.000, y = 13.840, z = 0.0 }
13 = { name = "right_pen_bl", x = 88.500,  y = 13.840, z = 0.0 }
14 = { name = "right_pen_tl", x = 88.500,  y = 54.160, z = 0.0 }
15 = { name = "right_pen_tr", x = 105.000, y = 54.160, z = 0.0 }
16 = { name = "right_pen_spot", x = 94.000, y = 34.000, z = 0.0 }

[topology]
lines = [
  # Pitch Perimeter
  [0, 1], [1, 2], [2, 3], [3, 0],
  # Halfway line
  [4, 5],
  # Left penalty area
  [7, 8], [8, 9], [9, 10],
  # Right penalty area
  [12, 13], [13, 14], [14, 15]
]

# Metric circular structures (projected onto image space via homography)
[[circles]]
name = "center_circle"
center_point = 6
radius = 9.15
samples = 64

[[arcs]]
name = "left_penalty_arc"
center_point = 11
radius = 9.15
angle_start_deg = -53.0518
angle_end_deg = 53.0518
samples = 32

[[arcs]]
name = "right_penalty_arc"
center_point = 16
radius = 9.15
angle_start_deg = 126.9482
angle_end_deg = 233.0518
samples = 32
