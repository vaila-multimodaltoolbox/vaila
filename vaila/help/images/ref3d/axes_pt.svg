<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="Segoe UI, system-ui, sans-serif" role="img" aria-label="X, Y, Z axes, right-handed">
<defs><marker id="arrow-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6453d"/></marker><marker id="arrow-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="arrow-z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/></marker><marker id="arrow-seq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="0.5" y="0.5" width="559" height="339" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<polygon points="123.2,244.8 237.4,244.8 329.8,177.6 215.6,177.6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="5 4"/>
<text x="225.4" y="207.8" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="3" paint-order="stroke">chão  Z = 0</text>
