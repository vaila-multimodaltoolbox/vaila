<text x="276.0" y="234.8" font-size="14" fill="#d6453d" stroke="#ffffff" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="start">X  lateral</text>
<line x1="123.2" y1="244.8" x2="238.7" y2="160.8" stroke="#2f9e44" stroke-width="4" marker-end="url(#arrow-y)"/>
<text x="248.7" y="156.8" font-size="14" fill="#2f9e44" stroke="#ffffff" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="start">Y  para frente (longe da câmera)</text>
