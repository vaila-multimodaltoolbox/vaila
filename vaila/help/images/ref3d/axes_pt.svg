<path d="M166.0,244.8 A42.8,42.8 0 0 0 157.8,219.6" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-seq)"/>
<text x="109.2" y="268.8" font-size="12" fill="#1e293b" stroke="#ffffff" stroke-width="3" paint-order="stroke">origem (0, 0, 0)</text>
<text x="350.0" y="294.0" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="3" paint-order="stroke">Mão direita: dedos giram X → Y,</text>
<text x="350.0" y="312.0" font-size="12" fill="#64748b" stroke="#ffffff" stroke-width="3" paint-order="stroke">polegar = Z (X × Y = Z)</text>
</svg>
